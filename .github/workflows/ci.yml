name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uv run --no-project --with astrbot --with-requirements requirements.txt --with pytest --with pytest-asyncio pytest -q
